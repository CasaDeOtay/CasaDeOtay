key: resy_dining
card_product_key: amex_platinum_consumer_us
version: 1
status: active
display_name: Quarterly Resy restaurant credit
plain_summary: >
  Up to $100 back each quarter when you pay at restaurants that use Resy.
  You have to turn this on in your Amex account first.
cadence: quarterly
allowance_cents: 10000
requires_enrollment: true
enrollment_url: https://www.americanexpress.com/en-us/account/benefits
effective_from: 2025-10-01
effective_to: null
verification: secondary_verified
terms_verified_on: 2026-09-06
sources:
  - https://www.cnbc.com/select/amex-platinum-card-2025-changes/
  - https://thepointsguy.com/credit-cards/amex-platinum-use-credits-before-end-quarter/
match:
  exclusive_group: dining
  patterns:
    - { kind: prefix, pattern: "RESY",   weight: 0.50 }
    - { kind: pfc,    pattern: "FOOD_AND_DRINK_RESTAURANT", weight: 0.10 }
  notes: >
    This is the hardest matcher in the set. Most qualifying charges post under the
    restaurant's own name, not Resy, so a category-only match is all we get. That
    caps confidence at "possible" until a statement credit confirms it. Do not
    guess which restaurants are on Resy; there is no reliable merchant list.
credit:
  descriptor_tokens: ["RESY", "STATEMENT CREDIT"]
  max_lag_days: 60
