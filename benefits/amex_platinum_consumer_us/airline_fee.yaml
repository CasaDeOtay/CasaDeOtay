key: airline_fee
card_product_key: amex_platinum_consumer_us
version: 1
status: active
display_name: Airline fee credit
plain_summary: >
  Up to $200 back each calendar year on extra fees from one airline you pick in
  advance, such as checked bags or seat selection. It does not cover airfare itself.
cadence: calendar_year
allowance_cents: 20000
requires_enrollment: true
enrollment_url: https://www.americanexpress.com/en-us/account/benefits
requires_user_selection: airline
effective_from: 2025-09-18
effective_to: null
verification: secondary_verified
terms_verified_on: 2026-09-06
sources:
  - https://awardwallet.com/credit-cards/amex-membership-rewards/amex-platinum-airline-credit/
match:
  patterns:
    - { kind: pfc, pattern: "TRAVEL_AIRLINES", weight: 0.10 }
  notes: >
    The messiest benefit in the set and the one most likely to make us wrong.
    Incidental fees qualify; tickets do not; and both post under the same airline
    descriptor. Amount is the only weak separator (a $35 bag fee vs a $420 fare).
    The user must pick their airline for the year before we match anything.
    Confidence ceiling is "possible" on purchase evidence alone. Deferred to M3.
credit:
  descriptor_tokens: ["AIRLINE FEE", "STATEMENT CREDIT"]
  max_lag_days: 90
